Bio_Short : >
 I am a Computer Scientist at
 [NASA's Office of Data Science and Informatics (ODSI)](https://www.nasa.gov/marshall/marshall-space-flight-missions/office-of-data-science-and-informatics-odsi/),
 where I build and scale foundation models for science. I work with satellite
 imagery, instrument observations, and decades of atmospheric reanalysis,
 turning scientific data into open models that researchers can adapt to their
 own problems.

 My work includes [Prithvi WxC](https://science.nasa.gov/open-science/ai-model-weather-climate/), a foundation
 model for weather and climate, and [Surya](https://science.data.nasa.gov/features-events/inside-surya-solar-ai-model),
 a foundation model for heliophysics. I work across the full pipeline: curating
 datasets, designing architectures suited to the data, and scaling pretraining
 across hundreds of GPUs.

 My background is in computer vision. I completed my MS at
 [UC Riverside](https://www.ucr.edu/), working with
 [Prof. Amit K. Roy-Chowdhury](https://vcg.ece.ucr.edu/amit) in the
 [Visual Computing Group](https://vcg.ece.ucr.edu/) on 3D human pose estimation
 under occlusion for the [IARPA BRIAR](https://www.iarpa.gov/research-programs/briar)
 project. Before that, I worked with
 [Prof. Anirban Chakraborty](https://scholar.google.co.in/citations?user=NtAsZK-2HjcC&hl=en)
 at [IISc Bangalore](https://iisc.ac.in/)'s
 [Visual Computing Lab](https://visual-computing.in/) on domain adaptation and
 adversarial robustness.

 Away from the GPUs, I am usually [traveling](#travel), chasing good light with
 my camera, and taking table tennis a little too seriously.

